name: Fetch and Deploy Schedule

on:
  schedule:
    # Runs every day at 00:00 UTC (adjust as needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Live Schedule JSON
        run: |
          mkdir -p public/data
          curl -s http://110.92.72.98:5002/api/jadwal-info -o public/data/jadwal.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/jadwal.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update schedule data" && git push)
