<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal SMASA - Custom Viewer</title>
  
  <!-- Fonts & Capture Library -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { padding: 30px; background: #eef1f5; display: flex; flex-direction: column; align-items: center; }

    /* Controls Bar */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .controls select, .controls button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      cursor: pointer;
    }
    .btn-export { background: #111827; color: #ffffff; font-weight: 600; border: none !important; }
    .btn-export:hover { background: #374151; }

    /* SCHEDULE CARD (Captured as PNG) */
    #schedule-card {
      width: 1250px;
      background: #ffffff;
      padding: 30px;
      border: 2px solid #000000;
      color: #000000;
    }

    /* Top Header */
    .card-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
    .school-title { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; }
    .school-subtitle { font-size: 13px; color: #4b5563; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    .class-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-align: right; color: #6b7280; }
    .class-name { font-size: 32px; font-weight: 800; text-align: right; line-height: 1; }

    /* Table Grid */
    .grid-table {
      display: grid;
      grid-template-columns: 90px repeat(10, 1fr);
      border: 2px solid #000000;
    }

    .cell {
      border-right: 1px solid #000000;
      border-bottom: 1px solid #000000;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 65px;
    }

    /* Column Headers & Rows */
    .period-header { background: #f3f4f6; font-size: 11px; font-weight: 700; }
    .period-time { font-size: 9px; font-weight: 400; color: #4b5563; margin-top: 3px; }
    
    .day-cell {
      background: #111827;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
    }

    /* Text Inside Cells */
    .subject-title { font-size: 11px; font-weight: 700; line-height: 1.2; }
    .teacher-name { font-size: 9.5px; color: #374151; margin-top: 4px; line-height: 1.1; }

    /* Custom Pastel Colors */
    .bg-math { background-color: #d1fae5; }     /* Soft Green */
    .bg-sosio { background-color: #e0f2fe; }    /* Soft Blue */
    .bg-sastra { background-color: #fae8ff; }   /* Soft Purple */
    .bg-sejarah { background-color: #fef3c7; }  /* Soft Yellow */
    .bg-default { background-color: #f9fafb; }  /* Light Grey */

    /* Card Footer */
    .card-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 10.5px;
      color: #4b5563;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Controls -->
  <div class="controls">
    <label for="classSelect" style="align-self: center; font-weight: 600;">Pilih Kelas:</label>
    <select id="classSelect" onchange="renderSchedule()">
      <option value="">Memuat data...</option>
    </select>
    <button class="btn-export" onclick="exportToPNG()">Export sebagai PNG</button>
  </div>

  <!-- Printable Schedule Card -->
  <div id="schedule-card">
    <div class="card-header">
      <div>
        <div class="school-title">SMAN 1 LUMAJANG</div>
        <div class="school-subtitle">TAHUN PELAJARAN 2025/2026</div>
      </div>
      <div>
        <div class="class-label">KELAS</div>
        <div class="class-name" id="displayClassName">-</div>
      </div>
    </div>

    <!-- Table Container -->
    <div class="grid-table" id="gridContainer"></div>

    <div class="card-footer">
      <span id="footerLeft">PAPAN JADWAL</span>
      <span>DIBUAT OTOMATIS DARI DATA JADWAL</span>
    </div>
  </div>

  <script>
    let scheduleData = {};

    const timeSlots = [
      { p: 1, time: "06:45 - 07:25" },
      { p: 2, time: "07:25 - 08:05" },
      { p: 3, time: "08:05 - 08:45" },
      { p: 4, time: "08:45 - 09:25" },
      { p: 5, time: "10:10 - 10:50" },
      { p: 6, time: "10:50 - 11:30" },
      { p: 7, time: "12:35 - 13:15" },
      { p: 8, time: "13:15 - 13:55" },
      { p: 9, time: "13:55 - 14:35" },
      { p: 10, time: "14:35 - 15:15" }
    ];

    const days = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat"];

    function getSubjectColorClass(subjectName = "") {
      const name = subjectName.toLowerCase();
      if (name.includes("matematika") || name.includes("biologi")) return "bg-math";
      if (name.includes("sosiologi") || name.includes("ekonomi")) return "bg-sosio";
      if (name.includes("sejarah") || name.includes("geografi")) return "bg-sejarah";
      if (name.includes("inggris") || name.includes("indonesia") || name.includes("jawa")) return "bg-sastra";
      return "bg-default";
    }

    async function loadJadwal() {
      try {
        // Reads the local jadwal.json file placed in the same folder
        const response = await fetch("./jadwal.json");
        const rawData = await response.json();

        scheduleData = {};
        const items = Array.isArray(rawData) ? rawData : (rawData.data || []);

        items.forEach(item => {
          const className = item.kelas || item.class_name || item.class || "Unknown";
          const day = item.hari || item.day;
          const period = item.jam_ke || item.period || item.jam;
          const subject = item.mapel || item.subject || "-";
          const teacher = item.guru || item.teacher || "";

          if (!scheduleData[className]) scheduleData[className] = {};
          if (!scheduleData[className][day]) scheduleData[className][day] = {};

          scheduleData[className][day][period] = {
            subject: subject,
            teacher: teacher,
            bg: getSubjectColorClass(subject)
          };
        });

        const classList = Object.keys(scheduleData).sort();
        populateClassDropdown(classList);
        if (classList.length > 0) renderSchedule();

      } catch (err) {
        console.error("Error loading JSON file:", err);
        alert("Gagal membaca file jadwal.json. Pastikan file tersebut ada di folder yang sama.");
      }
    }

    function populateClassDropdown(classes) {
      const select = document.getElementById("classSelect");
      select.innerHTML = "";
      classes.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.innerText = c;
        select.appendChild(opt);
      });
    }

    function renderSchedule() {
      const selectedClass = document.getElementById("classSelect").value;
      if (!selectedClass) return;

      document.getElementById("displayClassName").innerText = selectedClass;
      document.getElementById("footerLeft").innerText = `PAPAN JADWAL - ${selectedClass}`;

      const grid = document.getElementById("gridContainer");
      grid.innerHTML = "";

      // Header Row
      grid.appendChild(createCell("", "period-header"));
      timeSlots.forEach(slot => {
        const header = document.createElement("div");
        header.className = "cell period-header";
        header.innerHTML = `<div>${slot.p}</div><div class="period-time">${slot.time}</div>`;
        grid.appendChild(header);
      });

      // Day Rows
      days.forEach(day => {
        grid.appendChild(createCell(day, "day-cell"));

        for (let p = 1; p <= 10; p++) {
          const entry = scheduleData[selectedClass]?.[day]?.[p];
          const cell = document.createElement("div");

          if (entry) {
            cell.className = `cell ${entry.bg}`;
            cell.innerHTML = `<div class="subject-title">${entry.subject}</div><div class="teacher-name">${entry.teacher}</div>`;
          } else {
            cell.className = "cell";
          }
          grid.appendChild(cell);
        }
      });
    }

    function createCell(text, className = "") {
      const cell = document.createElement("div");
      cell.className = `cell ${className}`;
      cell.innerText = text;
      return cell;
    }

    function exportToPNG() {
      const card = document.getElementById("schedule-card");
      html2canvas(card, { scale: 2 }).then(canvas => {
        const link = document.createElement("a");
        link.download = `Jadwal-${document.getElementById("classSelect").value}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    // Load schedule when page opens
    loadJadwal();
  </script>
</body>
</html>
